<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70" fill="none" role="img" aria-label="CONectaMente — Comunicación &amp; Conexión">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <!-- Isotype / Icon -->
  <g transform="translate(10, 10)">
    <!-- Connected dialogue bubbles and resonance waves -->
    <rect x="0" y="4" width="34" height="28" rx="8" fill="url(#brandGrad)" />
    <path d="M12 32 L16 38 L22 32 Z" fill="#0D9488"/>
    <!-- Overlapping dialogue node with pulse -->
    <circle cx="28" cy="16" r="14" fill="url(#bubbleGrad)" fill-opacity="0.9" />
    <path d="M26 12 Q28 8 32 10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <!-- Dynamic connection node & wave -->
    <circle cx="38" cy="34" r="7" fill="url(#warmGrad)" />
    <path d="M42 28 C48 30, 48 38, 44 42" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="17" cy="18" r="2.5" fill="#FFFFFF"/>
    <circle cx="28" cy="16" r="2.5" fill="#0F172A"/>
  </g>
  <!-- Wordmark -->
  <text x="68" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.8px" fill="#0F172A">
    CON<tspan fill="#0D9488" font-weight="600">ecta</tspan><tspan fill="#0F172A">Mente</tspan>
  </text>
  <!-- Baseline tag -->
  <text x="70" y="58" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="8.5" letter-spacing="2.2px" fill="#64748B">
    COMUNICACIÓN &amp; CONEXIÓN
  </text>
</svg>
